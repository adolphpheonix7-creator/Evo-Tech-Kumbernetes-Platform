apiVersion: v1
kind: Namespace
metadata:
  name: evo-tech

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo-tech-api
  namespace: evo-tech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evo-tech-api
  template:
    metadata:
      labels:
        app: evo-tech-api
    spec:
      containers:
        - name: api
          image: evo-tech-api:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: evo-tech-api
  namespace: evo-tech
spec:
  selector:
    app: evo-tech-api
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
